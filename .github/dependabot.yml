version: 2

# Cooldown: a new release is proposed only once it is 7 days old, so a yanked
# or compromised release is usually gone before it reaches a PR. Security
# updates ignore the cooldown and still arrive immediately.
updates:
  # Go modules — weekly, grouped to keep PR noise low
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # pnpm workspaces — weekly, dev/prod grouped separately
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions — keeps the SHA-pinned actions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
