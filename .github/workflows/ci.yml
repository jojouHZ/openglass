name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go — build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          diff=$(gofmt -l cmd internal)
          if [ -n "$diff" ]; then
            echo "Unformatted files:"; echo "$diff"; exit 1
          fi

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go build
        run: go build ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./cmd/... ./internal/...

  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Advisory: npm ecosystem noise — report but do not gate.
      - name: pnpm audit (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level=critical

  security:
    name: Security — govulncheck + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Gate: reachable Go vulnerabilities only — near-zero noise.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/...

      # Advisory: FS + secret scan at HIGH/CRITICAL.
      - name: Trivy fs scan (advisory)
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          ignore-unfixed: true
