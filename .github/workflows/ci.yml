name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go — build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          diff=$(gofmt -l cmd internal)
          if [ -n "$diff" ]; then
            echo "Unformatted files:"; echo "$diff"; exit 1
          fi

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go build
        run: go build ./cmd/... ./internal/...

      - name: go test (with race detector)
        run: go test -race ./cmd/... ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@e7fa5ac41e1cf5b7d48e45e42232ce7ada589601 # v9.1.0
        with:
          version: v2.14.0
          args: ./cmd/... ./internal/...

  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Advisory: npm ecosystem noise — report but do not gate.
      - name: pnpm audit (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level=critical

  security:
    name: Security — govulncheck + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache: true

      # Gate: reachable Go vulnerabilities only — near-zero noise.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./cmd/... ./internal/...

      # Advisory: FS + secret scan at HIGH/CRITICAL.
      - name: Trivy fs scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          ignore-unfixed: true
