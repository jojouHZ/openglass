name: Vectorize Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
        ports:
          - 6333:6333
          - 6334:6334

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Cache HuggingFace models
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-${{ hashFiles('scripts/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-huggingface-

    - name: Install dependencies
      # Regenerate with: uv pip compile scripts/requirements.txt \
      #   --generate-hashes --python-version 3.11 -o scripts/requirements-hashed.txt
      run: pip install --require-hashes -r scripts/requirements-hashed.txt

    - name: Wait for Qdrant to be ready
      run: |
        timeout 90 bash -c 'until curl -sf http://localhost:6333/; do sleep 2; done'

    - name: Vectorize documentation
      run: |
        python scripts/vectorize_docs.py --directory docs
        python scripts/vectorize_docs.py --file README.md
      env:
        HF_HOME: ~/.cache/huggingface

    - name: Test vectorization
      run: |
        python scripts/vectorize_docs.py --search "WebSocket implementation"
      env:
        HF_HOME: ~/.cache/huggingface

    - name: Summary
      run: |
        echo "Documentation vectorization completed successfully"
        echo "Qdrant collection: openglass_docs"
        echo "Embeddings: BGE-large (1024-dimensional)"
