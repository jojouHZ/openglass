<!DOCTYPE html>
<!-- S5 · Chat View 1:1 — screen-s5. header-chat + message-day-group + composer -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Chat</title>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="header">
      <svg class="icon back"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div class="title-block"><div class="title">alice</div>
        <div class="subtitle">online</div></div>
      <span class="avatar avatar-40"></span>
      <!-- ⋮ canonical: centered under title via .header .menu -->
      <svg class="icon icon-16 menu"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </div>
    <div class="scroll">
      <div class="msg-flow">
        <div class="day-sep">Sep 14</div>
        <!-- incoming series: avatar only on LAST bubble -->
        <div class="msg-series">
          <div class="msg">
            <span class="avatar avatar-28"></span>
            <div class="bubble"><div class="body">message text</div>
              <div class="foot"><span class="time">10:31</span>
                <span class="state"><svg class="icon icon-14"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></span></div></div>
          </div>
          <div class="msg last">
            <span class="avatar avatar-28"></span>
            <div class="bubble"><div class="body">second one in a row</div>
              <div class="foot"><span class="time">10:32</span>
                <span class="state"><svg class="icon icon-14"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></span></div></div>
            <span class="reaction-tray">👍 2</span>
          </div>
        </div>
        <!-- own series: avatar on last bubble, right side on mobile -->
        <div class="msg-series">
          <div class="msg own">
            <span class="avatar avatar-28"></span>
            <div class="bubble"><div class="body">message text</div>
              <div class="foot"><span class="time">10:37</span>
                <span class="state"><svg class="icon icon-14"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></span></div></div>
          </div>
          <div class="msg own last">
            <span class="avatar avatar-28"></span>
            <div class="bubble failed"><div class="body">this one did not send</div>
              <div class="foot"><span class="time">10:38</span>
                <span class="state"><svg class="icon icon-14"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span></div></div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="composer">
        <div class="pill">
          <span class="attach"><svg class="icon"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
          <span>message…</span>
        </div>
        <button class="send"><svg class="icon"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
      </div>
    </div>
    <p class="dev-note">WS /chats/:id · own right on mobile, all left on desktop</p>
  </main>
</body>
</html>
