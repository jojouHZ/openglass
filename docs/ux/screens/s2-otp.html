<!DOCTYPE html>
<!-- OpenGlass · S2 OTP — reference prototype.
     Mirrors Penpot page "Hi-Fi · S2 · OTP" (screen-s2-mobile + screen-s2-desktop).
     Tokens: docs/ux/design-tokens.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenGlass — Verify code</title>
<style>
  :root {
    --ink: #181818; --muted: #666666; --line: #c4c4c4;
    --bg: #ffffff; --canvas: #f8f8f8;
    --font: "Source Code Pro", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font); background: var(--canvas); }

  .screen {
    width: 390px; min-height: 100dvh; margin: 0 auto;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding-bottom: 24px;
  }
  .status-bar {
    width: 100%; height: 44px; padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; justify-content: space-between;
    padding-inline: 24px; font-size: 13px; color: var(--ink);
  }
  .body {
    align-self: stretch; display: flex; flex-direction: column;
    align-items: flex-start; gap: 16px; padding-left: 24px;
  }
  .nav-back {
    width: 44px; height: 44px; display: flex; align-items: center;
    border: none; background: none; cursor: pointer; padding: 0;
    color: var(--ink);
  }
  .title { font-size: 24px; color: var(--ink); }
  .subtitle { font-size: 12px; color: var(--muted); }

  .otp-row { display: flex; gap: 8px; }
  .otp-cell {
    width: 48px; height: 60px; border: 1.5px solid var(--line);
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 20px; color: var(--ink);
    font-family: inherit; background: var(--bg);
  }
  .otp-cell:focus { border-color: var(--ink); outline: none; }

  .btn-primary {
    width: 342px; height: 52px; border: none; border-radius: 8px;
    background: var(--ink); color: #fff; font: inherit; font-size: 14px;
    cursor: pointer;
  }
  .btn-primary:active { opacity: .88; }

  .resend { font-size: 11px; color: var(--muted); }
  .dev-note { font-size: 9px; color: var(--muted); }

  @media (min-width: 1024px) {
    .screen {
      width: auto; min-height: 100dvh;
      background: var(--canvas); justify-content: center;
    }
    .status-bar, .dev-note { display: none; }
    .body {
      align-self: center; padding-left: 0;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 16px; padding: 40px;
    }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="body">
      <button class="nav-back" aria-label="back">←</button>
      <h1 class="title">Check your email</h1>
      <p class="subtitle">Code sent to user@mail.com</p>
      <div class="otp-row">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
      </div>
      <button class="btn-primary" type="submit">Verify</button>
      <p class="resend">Resend code · 60s</p>
    </div>
    <p class="dev-note">data: otp_code → POST /auth/verify → token</p>
  </main>
</body>
</html>
