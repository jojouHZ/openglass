<!DOCTYPE html>
<!-- S2 · OTP — screen-s2. nav-back + 6 otp-cells + verify -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Verify code</title>
</head>
<body>
  <main class="screen auth">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="content center-wrap" style="padding-top:24px">
      <button class="nav-back" aria-label="back">
        <svg class="icon"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 class="screen-title">Check your email</h1>
      <p class="hint-text">code sent to user@mail.com</p>
      <div class="otp-row">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
        <input class="otp-cell" maxlength="1">
      </div>
      <button class="btn btn-primary" style="width:100%">Verify</button>
      <p class="hint-text">resend code · 60s</p>
    </div>
    <p class="dev-note">otp_code → POST /auth/verify → token</p>
  </main>
</body>
</html>
