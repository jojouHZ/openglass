<!DOCTYPE html>
<!-- S4b · Chat List — screen-s4b. header-list + folder-bar + chat-item list + bottom-nav -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Chats</title>
</head>
<body>
  <main class="screen app">
    <div class="pane-list">
      <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
      <div class="header">
        <span class="avatar avatar-40" style="justify-self:start"></span>
        <div class="title-block"><div class="title">Chats</div></div>
        <button class="icon-btn plus" aria-label="new chat"><svg class="icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div class="folder-bar">
        <span class="folder-tab active">all</span>
        <span class="folder-tab">private</span>
        <span class="folder-tab">groups</span>
        <span class="folder-tab">work</span>
        <span class="folder-tab chip-ghost">+ new</span>
      </div>
      <div style="padding:8px 24px"><div class="search-bar">
        <svg class="icon icon-16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>search</span>
      </div></div>
      <div class="scroll">
        <!-- saved messages: self-chat, always pinned top (US-2.5.3) -->
        <div class="chat-item saved">
          <span class="avatar avatar-52"><svg class="icon icon-16"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></span>
          <div class="col"><div class="name">saved messages</div>
            <div class="preview">draft: deploy checklist</div></div>
          <div class="side"><span class="time">9:41</span>
            <div class="mrow"><svg class="icon"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg></div></div>
        </div>
        <div class="chat-item">
          <span class="avatar avatar-52"></span>
          <div class="col"><div class="name">alice
            <svg class="icon"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg></div>
            <div class="preview" style="color:var(--accent)">typing…</div></div>
          <div class="side"><span class="time">9:41</span><span class="badge">2</span></div>
        </div>
        <div class="chat-item">
          <span class="avatar avatar-52"></span>
          <div class="col"><div class="name">bob</div>
            <div class="preview">see you tomorrow</div></div>
          <div class="side"><span class="time">9:12</span></div>
        </div>
        <!-- muted: badge soft + bell-off in name row (US-2.5.2) -->
        <div class="chat-item">
          <span class="avatar avatar-52"></span>
          <div class="col"><div class="name">carol
            <svg class="icon"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg></div>
            <div class="preview">sent a file</div></div>
          <div class="side"><span class="time">8:40</span><span class="badge" style="background:var(--line);color:var(--muted)">5</span></div>
        </div>
        <div class="chat-item">
          <span class="avatar avatar-52"></span>
          <div class="col"><div class="name">work group</div>
            <!-- chips live on the preview line, left of text, size xs -->
            <div class="preview"><span class="chip chip-xs chip-soft">group</span>
              <span class="text">dave: looks good</span></div></div>
          <div class="side"><span class="time">mon</span><span class="badge">12</span></div>
        </div>
      </div>
      <nav class="bottom-nav">
        <span class="tab active"><svg class="icon"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><i class="dot"></i></span>
        <span class="tab"><svg class="icon"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.08 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><i class="dot"></i></span>
        <span class="tab"><svg class="icon"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><i class="dot"></i></span>
        <span class="tab"><svg class="icon"><path d="M18 11c-1.5 0-2.5.5-3 2"/><path d="M4 6a2 2 0 0 0-2 2v4a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V8a2 2 0 0 0-2-2h-3a8 8 0 0 0-5 2 8 8 0 0 0-5-2Z"/><path d="M8 11c1.5 0 2.5.5 3 2"/></svg><i class="dot"></i></span>
        <span class="tab"><svg class="icon"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1l2.1-2.1m10-10 2.1-2.1"/></svg><i class="dot"></i></span>
      </nav>
    </div>
    <div class="pane-chat" style="display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:12px">
      select a chat
    </div>
    <p class="dev-note" style="position:fixed;bottom:4px;left:8px">GET /chats · WS presence · unread badges</p>
  </main>
</body>
</html>
