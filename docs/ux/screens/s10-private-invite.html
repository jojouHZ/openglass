<!DOCTYPE html>
<!-- S10 · Private Invite — screen-s10. chat + dark invite sheet -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Private invite</title>
<style>
  .sheet { width: 390px; }
  .sheet .chips { display: flex; gap: 8px; justify-content: center; }
  .sheet .actions { display: flex; gap: 12px; }
  .sheet .actions .btn { flex: 1; }
</style>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="header"><svg viewBox="0 0 24 24" class="icon back"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div class="title-block"><div class="title">alice</div><div class="subtitle">online</div></div>
      <span class="avatar avatar-40"></span></div>
    <div class="scroll"><div class="msg-flow">
      <div class="msg-series"><div class="msg last"><span class="avatar avatar-28"></span>
        <div class="bubble"><div class="body">can we talk private?</div>
          <div class="foot"><span class="time">10:31</span></div></div></div></div>
    </div></div>
    <div class="composer"><div class="pill"><span>message…</span></div>
      <button class="send"><svg viewBox="0 0 24 24" class="icon"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button></div>
  </main>
  <div class="scrim bottom">
    <div class="sheet">
      <i class="grabber"></i>
      <!-- dismiss: X top-right (desktop + mobile); scrim tap also closes -->
      <button class="icon-btn x-close" aria-label="close">
        <svg viewBox="0 0 24 24" class="icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div class="s-title">private session with alice</div>
      <div class="ttl-picker">
        <i class="band"></i>
        <div class="col"><span style="opacity:.25">23</span><span style="opacity:.5">0</span><span class="sel">0</span><span style="opacity:.5">1</span><span style="opacity:.25">2</span></div>
        <div class="lbl">hours</div>
        <div class="col"><span style="opacity:.25">5</span><span style="opacity:.5">9</span><span class="sel">10</span><span style="opacity:.5">11</span><span style="opacity:.25">15</span></div>
        <div class="lbl">min</div>
      </div>
      <div class="chips">
        <span class="preset-chip">5m</span>
        <span class="preset-chip sel">10m</span>
        <span class="preset-chip">30m</span>
        <span class="preset-chip">1h</span>
      </div>
      <div class="actions">
        <button class="btn" style="background:#fff;color:var(--ink)">accept</button>
      </div>
    </div>
  </div>
  <p class="dev-note" style="position:fixed;bottom:4px;left:8px;color:#fff">default 10m · 1m–24h · ephemeral, device-pair bound</p>
</body>
</html>
