<!DOCTYPE html>
<!-- S5c · Chat offline state — banner + queued message + degraded composer.
     US-7.3: connectivity loss is never silent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Chat (offline)</title>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="header">
      <svg viewBox="0 0 24 24" class="icon back"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div class="title-block"><div class="title">alice</div>
        <div class="subtitle">last seen recently</div></div>
      <span class="avatar avatar-40"></span>
    </div>
    <div class="banner warn">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
      offline — messages will be sent on reconnect
    </div>
    <div class="scroll"><div class="msg-flow">
      <div class="day-sep">today</div>
      <div class="msg-series"><div class="msg last"><span class="avatar avatar-28"></span>
        <div class="bubble"><div class="body">did the deploy go through?</div>
          <div class="foot"><span class="time">10:31</span>
            <span class="state"><svg viewBox="0 0 24 24" class="icon icon-14"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></span></div></div></div></div>
      <!-- queued: sending state stays until reconnect -->
      <div class="msg-series">
        <div class="msg own"><span class="avatar avatar-28"></span>
          <div class="bubble sending"><div class="body">yes, all green</div>
            <div class="foot"><span class="time">10:32</span>
              <span class="state"><svg viewBox="0 0 24 24" class="icon icon-14"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg></span></div></div></div>
        <div class="msg own last"><span class="avatar avatar-28"></span>
          <div class="bubble sending"><div class="body">queued while offline</div>
            <div class="foot"><span class="time">10:33</span>
              <span class="state"><svg viewBox="0 0 24 24" class="icon icon-14"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg></span></div></div></div>
      </div>
    </div></div>
    <div>
      <!-- composer stays usable (queue) but unsupported actions grey out -->
      <div class="composer disabled">
        <div class="pill">
          <span class="attach"><svg viewBox="0 0 24 24" class="icon"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
          <span>message will queue…</span>
        </div>
        <button class="send"><svg viewBox="0 0 24 24" class="icon"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
      </div>
    </div>
    <p class="dev-note">WS down → banner + queue · POST /messages retries on reconnect</p>
  </main>
</body>
</html>
