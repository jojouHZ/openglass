<!DOCTYPE html>
<!-- S9b · Group chat — member WITHOUT post rights (US-4.3).
     Composer replaced by readonly-bar; actions hidden, not silently failing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Group (read-only)</title>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="header">
      <svg viewBox="0 0 24 24" class="icon back"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div class="title-block"><div class="title">announcements</div>
        <div class="subtitle">4 members · read-only</div></div>
      <span class="avatar avatar-40"></span>
    </div>
    <div class="scroll"><div class="msg-flow">
      <div class="day-sep">Nov 29</div>
      <div class="msg-series">
        <div class="msg"><span class="avatar avatar-28"></span>
          <div class="bubble"><div class="head"><span class="sender">alice</span>
            <span class="chip chip-xs chip-soft">owner</span></div>
            <div class="body">release notes are in the wiki</div>
            <div class="foot"><span class="time">17:00</span>
              <span class="state"><svg viewBox="0 0 24 24" class="icon icon-14"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></span></div></div></div>
        <div class="msg last"><span class="avatar avatar-28"></span>
          <div class="bubble"><div class="body">questions → #general, please</div>
            <div class="foot"><span class="time">17:01</span>
              <span class="state"><svg viewBox="0 0 24 24" class="icon icon-14"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></span></div></div></div>
      </div>
    </div></div>
    <!-- member has no `post` right: bar explains instead of dead composer -->
    <div class="readonly-bar">
      <svg viewBox="0 0 24 24" class="icon icon-16"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      read-only — only members with post rights can write
    </div>
    <p class="dev-note">chat.rights.post == false → readonly-bar · reactions may still be allowed</p>
  </main>
</body>
</html>
