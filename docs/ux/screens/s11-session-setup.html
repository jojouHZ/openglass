<!DOCTYPE html>
<!-- S11 · Session Setup card — screen-s11. system-card inside chat -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Session setup</title>
<style>
  .sys-card { width: 342px; margin: 0 auto; border: 1.5px solid var(--body);
    border-radius: 16px; background: var(--bg); padding: 20px;
    display: flex; flex-direction: column; gap: 12px; }
  .sys-card .c-title { font-size: 14px; }
  .sys-card .c-body { font-size: 11px; color: var(--muted); }
  .sys-card .c-actions { display: flex; gap: 12px; }
  .sys-card .c-actions .btn { flex: 1; height: 44px; font-size: 13px; }
</style>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="header"><svg class="icon back"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div class="title-block"><div class="title">alice</div><div class="subtitle">online</div></div>
      <span class="avatar avatar-40"></span></div>
    <div class="scroll"><div class="msg-flow">
      <div class="msg last"><span class="avatar avatar-28"></span>
        <div class="bubble"><div class="body">hey</div>
          <div class="foot"><span class="time">10:31</span>
            <svg class="icon icon-14 state"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></div></div></div>
      <div class="sys-card">
        <div class="c-title">private session</div>
        <div class="c-body">alice wants to start an ephemeral session ·
          expires in 10 min · device-pair only</div>
        <div class="c-actions">
          <button class="btn btn-secondary">decline</button>
          <button class="btn btn-primary">accept</button>
        </div>
      </div>
    </div></div>
    <div class="composer"><div class="pill"><span>message…</span></div>
      <button class="send"><svg class="icon"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button></div>
    <p class="dev-note">system-card variant of invite · in-chat alternative to sheet</p>
  </main>
</body>
</html>
