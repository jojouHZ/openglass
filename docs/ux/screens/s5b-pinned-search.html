<!DOCTYPE html>
<!-- S5b · Pinned message + in-chat search — screen-s5b -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Pinned</title>
<style>
  mark { background: var(--soft); color: inherit; }
</style>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="header">
      <svg viewBox="0 0 24 24" class="icon back"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div class="title-block"><div class="title">alice</div><div class="subtitle">online</div></div>
      <span class="avatar avatar-40"></span>
      <!-- ⋯ canonical: horizontal, centered under the title -->
      <svg viewBox="0 0 24 24" class="icon icon-16 menu"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
    </div>
    <!-- in-chat search: invoked from the header menu -->
    <div class="chat-search">
      <svg viewBox="0 0 24 24" class="icon icon-16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="q">six</span>
      <span class="count">2 of 3</span>
      <button class="icon-btn" aria-label="previous"><svg viewBox="0 0 24 24" class="icon icon-16"><path d="m18 15-6-6-6 6"/></svg></button>
      <button class="icon-btn" aria-label="next"><svg viewBox="0 0 24 24" class="icon icon-16"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="icon-btn" aria-label="close search"><svg viewBox="0 0 24 24" class="icon icon-16"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="pinned-bar">
      <svg viewBox="0 0 24 24" class="icon icon-16"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg>
      <i class="bar"></i>
      <span><span class="p-name">alice</span><br>pinned message text</span>
      <svg viewBox="0 0 24 24" class="icon icon-16" style="margin-left:auto"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>
    <div class="scroll"><div class="msg-flow">
      <div class="day-sep">Sep 14</div>
      <div class="msg-series"><div class="msg last"><span class="avatar avatar-28"></span>
        <div class="bubble"><div class="body">meet at <mark>six</mark>?</div>
          <div class="foot"><span class="time">10:31</span></div></div></div></div>
      <div class="msg-series"><div class="msg own last"><span class="avatar avatar-28"></span>
        <div class="bubble"><div class="body"><mark>six</mark> works</div>
          <div class="foot"><span class="time">10:37</span>
            <span class="state"><svg viewBox="0 0 24 24" class="icon icon-14"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg></span></div></div></div></div>
    </div></div>
    <div class="composer"><div class="pill">
      <span class="attach"><svg viewBox="0 0 24 24" class="icon"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
      <span>message…</span></div>
      <button class="send"><svg viewBox="0 0 24 24" class="icon"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button></div>
    <p class="dev-note">search invoked from header menu · highlights matches · pinned strip</p>
  </main>
</body>
</html>
