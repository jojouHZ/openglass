<!DOCTYPE html>
<!-- S1 · Invite/Email — screen-s1. auth layout: form → OTP request -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Invite</title>
</head>
<body>
  <main class="screen auth">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="content" style="display:flex;flex-direction:column;align-items:center">
      <img src="../brand/logo-tile.svg" width="64" height="64" alt="og" style="margin-bottom:24px">
      <div class="center-wrap" style="padding-top:0">
        <div class="field">
          <label class="field-label" for="invite">Invite code</label>
          <input class="input" id="invite" placeholder="invite code">
        </div>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="email">
        </div>
        <button class="btn btn-primary" style="width:100%">Request code</button>
      </div>
    </div>
    <p class="dev-note">invite_code + email → POST /auth/request</p>
  </main>
</body>
</html>
