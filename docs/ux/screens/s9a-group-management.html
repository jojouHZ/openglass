<!DOCTYPE html>
<!-- S9a · Group Management — screen-s9a. member-list with permission chips -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="base.css">
<title>OpenGlass — Group</title>
</head>
<body>
  <main class="screen">
    <div class="status-bar"><span>9:41</span><span>signal · wifi · batt</span></div>
    <div class="header">
      <svg class="icon back"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div class="title-block"><div class="title">work group</div>
        <div class="subtitle">4 members</div></div>
      <svg class="icon icon-16 menu"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </div>
    <div class="scroll">
      <div class="sec-label">members</div>
      <div class="member-row"><span class="avatar avatar-28"></span>
        <span class="name">alice</span><span class="chip chip-soft">owner</span></div>
      <div class="member-row"><span class="avatar avatar-28"></span>
        <span class="name">bob</span><span class="chip chip-line">invite</span>
        <svg class="icon icon-16 remove"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
      <div class="member-row"><span class="avatar avatar-28"></span>
        <span class="name">carol</span></div>
      <div class="member-row"><span class="avatar avatar-28"></span>
        <span class="name">dave</span><span class="chip chip-line">invited</span></div>
      <div class="member-row" style="color:var(--accent)">
        <svg class="icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        <span class="name">add member</span></div>
      <div class="settings-section">
        <div class="label">group</div>
        <div class="settings-row"><span class="grow">edit name</span>
          <svg class="icon icon-16 chev"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="settings-row"><span class="grow">permissions</span>
          <svg class="icon icon-16 chev"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="settings-row danger"><span class="grow">leave group</span></div>
      </div>
    </div>
    <p class="dev-note">perm chips: invite/edit/pin/kick · member = no chip · x = owner only</p>
  </main>
</body>
</html>
