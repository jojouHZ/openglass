openapi: 3.0.3
info:
  title: OpenGlass Public API
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    REST contract for the OpenGlass public layer (MVP scope).

    Source of truth for both `MockApiClient` and the Go backend — see
    `docs/dev/frontend-first-development.md`. No invented wire fields:
    additions require amending this file first.

    Conventions:
    - All endpoints are under `/api/v1`.
    - Auth uses `Authorization: Bearer <access_token>` (JWT, short-lived)
      plus a refresh token cookie/body flow.
    - Error envelope and codes: `docs/api/errors.md`.
    - Realtime events are out of scope here — see `docs/api/ws-events.md`.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Invite → OTP → profile registration, tokens, device sessions
  - name: users
    description: User search and profile cards
  - name: contacts
    description: Mutual contact relationships
  - name: chats
    description: Chat list and details (direct + group)
  - name: messages
    description: History, send, edit, delete, attachments, read cursors
  - name: groups
    description: Group management — party/raid rights model
  - name: reports
    description: User reports to the instance owner

paths:
  /healthz:
    get:
      tags: [auth]
      summary: Liveness/readiness probe for compose healthchecks and deploy smoke
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  postgres: { type: string, enum: [up, down] }
                  redis: { type: string, enum: [up, down] }
        '503':
          description: Service unhealthy — dependency down
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [degraded] }
                  postgres: { type: string, enum: [up, down] }
                  redis: { type: string, enum: [up, down] }
        default:
          description: Unexpected error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/otp/request:
    post:
      tags: [auth]
      summary: Request an OTP (S1 → S2)
      security: []
      operationId: requestOtp
      description: |
        Validates the invite code and sends a one-time code to the email.
        Rate-limited; resend cooldown is a contract constant
        (`OTP_RESEND_COOLDOWN_S = 60`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                inviteCode:
                  type: string
                  example: "GLS-9F2K-71"
                  description: |
                    Required for first registration only. Returning users
                    re-login with email + OTP alone — the invite gates
                    account creation, not every sign-in. Omitting it for an
                    unknown email → `invite_required`. The invite is
                    consumed at successful `verifyOtp`, not at this step —
                    a failed OTP attempt does not burn it.
                email: { type: string, format: email }
      responses:
        '202':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                required: [otpExpiresInS, resendAvailableInS]
                properties:
                  otpExpiresInS: { type: integer, example: 600 }
                  resendAvailableInS: { type: integer, example: 60 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: Resend cooldown active (`otp_cooldown`)
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: otp_cooldown
                  message: "Wait before requesting a new code"
                  details: { resendAvailableInS: 42 }
        '403':
          description: |
            `invite_required` — email unknown and no invite supplied;
            `invite_invalid` — invite supplied but wrong/consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                required:
                  value: { error: { code: invite_required, message: "Invite code required to register" } }
                invalid:
                  value: { error: { code: invite_invalid, message: "Invite code is invalid or already used" } }

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify OTP (S2 → S3 or straight to S4 for existing users)
      security: []
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, deviceName]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                deviceName: { type: string, example: "Pixel 8 — Chrome PWA" }
      responses:
        '200':
          description: |
            Verified. `needsProfile=true` for first login (client shows S3);
            `false` for returning users (client goes to S4).
          content:
            application/json:
              schema:
                type: object
                required: [needsProfile, accessToken, accessTokenExpiresInS, refreshToken]
                properties:
                  needsProfile: { type: boolean }
                  accessToken: { type: string }
                  accessTokenExpiresInS: { type: integer, example: 900 }
                  refreshToken: { type: string }
                  user:
                    type: object
                    nullable: true
                    description: |
                      `User` object, present only when `needsProfile=false`.
                      First login has no displayName/tag yet — profile is
                      created via `POST /auth/profile` (S3).
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: Code invalid or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  value: { error: { code: otp_invalid, message: "Wrong code" } }
                expired:
                  value: { error: { code: otp_expired, message: "Code expired, request a new one" } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/profile:
    post:
      tags: [auth]
      summary: Complete profile setup (S3 → S4)
      operationId: completeProfile
      description: |
        Sets the display name and binds the immutable unique tag
        `name#NNNN`. Requires `needsProfile` session. If the requested tag
        prefix is taken, `tagSuggestions` are returned instead. One-shot:
        on an account that already has a profile this returns
        `conflict` — use `PATCH /users/me` for later display-name changes
        (the tag never changes). When `requestedTag` is omitted the
        display-name prefix is attempted; a collision also yields
        `tag_taken` + suggestions.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 64, example: "jojou" }
                requestedTag:
                  type: string
                  description: Optional explicit tag attempt (e.g. "Jojou13245" from suggestions)
      responses:
        '200':
          description: Profile created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '409':
          description: Tag taken — suggestions in `error.details.tagSuggestions`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tag_taken:
                  value:
                    error:
                      code: tag_taken
                      message: "Tag is taken, pick a suggestion"
                      details:
                        tagSuggestions: ["Jojou13245", "Jojou48127", "jojou#9031"]
                conflict:
                  value:
                    error:
                      code: conflict
                      message: "Profile already exists"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate access + refresh tokens
      description: |
        Refresh tokens rotate on every use — the presented token is
        invalidated and a new pair is issued. Presenting an already-used
        refresh token (reuse detected, possible theft) revokes the entire
        device session: client gets `unauthorized` and must log in again.
      security: []
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, accessTokenExpiresInS, refreshToken]
                properties:
                  accessToken: { type: string }
                  accessTokenExpiresInS: { type: integer }
                  refreshToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current device session
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions:
    get:
      tags: [auth]
      summary: List device sessions (S14)
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceSession' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Revoke a specific device session (S14)
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me:
    get:
      tags: [users]
      summary: Own profile (app cold start, S4)
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      summary: Update own profile (S13 — display name is changeable anytime)
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 64 }
                avatarUrl: { type: string, nullable: true }
      responses:
        '200':
          description: Updated profile. `tag` never changes.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/search:
    get:
      tags: [users]
      summary: Search users by display name or tag (S6)
      operationId: searchUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Display-name substring or exact `name#NNNN` tag
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /users/{userId}:
    get:
      tags: [users]
      summary: User profile card (S7)
      operationId: getUser
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [user, relationship]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  relationship:
                    type: string
                    enum: [none, contact_incoming, contact_outgoing, contact_mutual, self]
                    description: |
                      none — strangers; contact_incoming — they added you,
                      you haven't (drives "add back?" prompt); contact_outgoing —
                      you added them; contact_mutual — both added; self.
        '404': { $ref: '#/components/responses/NotFound' }

  /contacts:
    get:
      tags: [contacts]
      summary: Contact list
      operationId: listContacts
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
    post:
      tags: [contacts]
      summary: Add contact (S7)
      operationId: addContact
      description: |
        Creates a one-directional contact entry. When both users have added
        each other the relation becomes `mutual` — required for 1-1 chat
        creation and private-session invites.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { $ref: '#/components/schemas/Contact' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already in contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contacts/{userId}:
    delete:
      tags: [contacts]
      summary: Remove contact
      operationId: removeContact
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /chats:
    get:
      tags: [chats]
      summary: Chat list (S4)
      operationId: listChats
      description: Ordered by last activity; includes 1-1 chats and groups.
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [chats]
                properties:
                  chats:
                    type: array
                    items: { $ref: '#/components/schemas/ChatSummary' }
    post:
      tags: [chats]
      summary: Open or create a 1-1 chat with a mutual contact (S7 → S5)
      operationId: openDirectChat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200':
          description: Existing chat returned
          content:
            application/json:
              schema:
                type: object
                required: [chat]
                properties:
                  chat: { $ref: '#/components/schemas/Chat' }
        '201':
          description: New chat created
          content:
            application/json:
              schema:
                type: object
                required: [chat]
                properties:
                  chat: { $ref: '#/components/schemas/Chat' }
        '403':
          description: Not mutual contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /chats/{chatId}:
    get:
      tags: [chats]
      summary: Chat details (S5 header / S7 actions)
      operationId: getChat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [chat]
                properties:
                  chat: { $ref: '#/components/schemas/Chat' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/pin:
    post:
      tags: [chats]
      summary: Pin/unpin chat in own chat list (S4 ordering)
      operationId: setChatPinned
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned: { type: boolean }
      responses:
        '204':
          description: Updated
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/messages:
    get:
      tags: [messages]
      summary: Message history, cursor-paginated (S5)
      operationId: listMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
        - name: before
          in: query
          schema: { type: string }
          description: Opaque cursor from `nextCursor` of a previous page
            (older messages). Server implements it over the per-chat `seq`;
            clients must treat it as opaque.
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
        - name: q
          in: query
          schema: { type: string, minLength: 2 }
          description: Full-text search within this chat (S5b). When set,
            results are matching messages ordered by seq desc; `before`
            cursor paginates further matches.
        - name: pinned
          in: query
          schema: { type: boolean }
          description: When true, returns only pinned messages (S5b pinned view)
        - name: around
          in: query
          schema: { type: string, format: uuid }
          description: |
            Jump-to-message (search results, pinned messages, replies):
            returns a window of `limit` messages centered on this message's
            seq. Mutually exclusive with `q`.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [messages, nextCursor]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor:
                    type: string
                    nullable: true
                    description: null when no more history
    post:
      tags: [messages]
      summary: Send a message (S5)
      operationId: sendMessage
      description: |
        Server assigns `id`, `seq`, `sentAt`. Delivery to online members
        happens via `message.new` WS event — see `docs/api/ws-events.md`.
        Optimistic-UI/outbox semantics are defined by the contract: client
        sends `clientNonce`; server echoes it in the response and the WS
        event for dedup. The pair `(senderId, clientNonce)` is unique:
        retrying a send with the same nonce returns the already-created
        message with `200` (never a duplicate), so outbox flush is safe.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientNonce]
              properties:
                clientNonce:
                  type: string
                  description: Client-generated idempotency key (uuid)
                text:
                  type: string
                  maxLength: 8192
                  description: Required unless `attachmentIds` is non-empty
                attachmentIds:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 10
                  description: |
                    Required unless `text` is non-empty. Each id must
                    reference an attachment uploaded to this chat
                    (`POST /chats/{chatId}/attachments`), else
                    `validation_failed`.
                replyToMessageId:
                  type: string
                  format: uuid
                  description: Must reference a message in this chat
      responses:
        '200':
          description: Idempotent replay — `clientNonce` was already used,
            returns the existing message
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}:
    patch:
      tags: [messages]
      summary: Edit own message
      operationId: editMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MessageId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [messages]
      summary: Delete a message
      operationId: deleteMessage
      description: Own messages; in groups also users with `delete_messages` right.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MessageId' }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/pin:
    post:
      tags: [messages]
      summary: Pin/unpin a message (S5b pinned view)
      description: |
        Direct chats: either party. Groups: requires `pin_messages`
        right or owner.
      operationId: setMessagePinned
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/MessageId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/attachments:
    post:
      tags: [messages]
      summary: Upload an attachment (photo/file)
      operationId: uploadAttachment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment: { $ref: '#/components/schemas/Attachment' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /chats/{chatId}/read:
    post:
      tags: [messages]
      summary: Mark chat read up to a message (read receipts)
      operationId: markRead
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upToSeq]
              properties:
                upToSeq: { type: integer }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204': { description: Recorded }

  /groups:
    post:
      tags: [groups]
      summary: Create group (S8)
      operationId: createGroup
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, memberIds]
              properties:
                title: { type: string, minLength: 1, maxLength: 128 }
                memberIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [chat]
                properties:
                  chat: { $ref: '#/components/schemas/Chat' }

  /groups/{chatId}:
    patch:
      tags: [groups]
      summary: Edit group info (S9a, requires `edit_info`)
      operationId: editGroup
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [chat]
                properties:
                  chat: { $ref: '#/components/schemas/Chat' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{chatId}/members:
    post:
      tags: [groups]
      summary: Add members (requires `invite_members` or owner)
      operationId: addGroupMembers
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberIds]
              properties:
                memberIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Added }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{chatId}/members/{userId}:
    delete:
      tags: [groups]
      summary: Remove member (requires `remove_members` or owner; members can remove themselves)
      operationId: removeGroupMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [groups]
      summary: Grant/revoke member rights (owner only, party/raid model)
      operationId: setMemberRights
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rights]
              properties:
                rights: { $ref: '#/components/schemas/MemberRights' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/GroupMember' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{chatId}/ownership:
    post:
      tags: [groups]
      summary: Transfer ownership (owner only)
      operationId: transferOwnership
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerId]
              properties:
                newOwnerId: { type: string, format: uuid }
      responses:
        '204': { description: Transferred }
        '403': { $ref: '#/components/responses/Forbidden' }

  /push/vapid-key:
    get:
      tags: [auth]
      summary: VAPID public key for Web Push subscription (S15)
      operationId: getVapidKey
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: VAPID public key (applicationServerKey)
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/subscriptions:
    post:
      tags: [auth]
      summary: Register a Web Push subscription for this device (S15)
      description: |
        Idempotent per `endpoint`: re-subscribing an existing endpoint
        updates keys and returns `200` with the existing id instead of
        creating a duplicate.
      operationId: createPushSubscription
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '200':
          description: Existing subscription updated (same endpoint)
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '201':
          description: Subscription stored (bound to the current device session)
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/subscriptions/{subscriptionId}:
    delete:
      tags: [auth]
      summary: Remove a Web Push subscription
      operationId: deletePushSubscription
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Removed
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports:
    post:
      tags: [reports]
      summary: Report a user to the instance owner (US-2.4)
      operationId: reportUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, reason]
              properties:
                userId: { type: string, format: uuid }
                reason: { type: string, maxLength: 1024 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202': { description: Report accepted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing/expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthorized, message: "Token expired" } }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit hit
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: rate_limited, message: "Too many requests" } }

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    User:
      type: object
      required: [id, displayName, tag, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName:
          type: string
          description: Free-form, changeable, NOT unique
        tag:
          type: string
          description: Immutable unique handle `name#NNNN`; `#1` reserved for instance owner
          example: "jojou#1042"
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    DeviceSession:
      type: object
      required: [id, deviceName, createdAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }

    Contact:
      type: object
      required: [user, mutual, addedAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        mutual:
          type: boolean
          description: Both parties added each other
        addedAt: { type: string, format: date-time }
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Last identity verification of this contact (US-2.5/2.6).
            Written by the private layer; always null until the private
            module ships. Drives the optional freshness reminder.

    Chat:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [direct, group] }
        title:
          type: string
          nullable: true
          description: Group title; null for direct chats
        peer: { $ref: '#/components/schemas/User' }
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
        createdAt: { type: string, format: date-time }

    ChatSummary:
      type: object
      required: [id, type, lastActivityAt, unreadCount]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [direct, group] }
        title: { type: string, nullable: true }
        peer: { $ref: '#/components/schemas/User' }
        lastMessage: { $ref: '#/components/schemas/Message' }
        lastActivityAt: { type: string, format: date-time }
        unreadCount: { type: integer }
        pinned: { type: boolean }

    MemberRights:
      type: object
      description: Party/raid model — owner grants specific rights per member
      properties:
        inviteMembers: { type: boolean, default: false }
        removeMembers: { type: boolean, default: false }
        editInfo: { type: boolean, default: false }
        pinMessages: { type: boolean, default: false }
        deleteMessages: { type: boolean, default: false }

    GroupMember:
      type: object
      required: [user, role, rights, joinedAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { type: string, enum: [owner, member] }
        rights: { $ref: '#/components/schemas/MemberRights' }
        joinedAt: { type: string, format: date-time }

    Attachment:
      type: object
      required: [id, kind, mimeType, sizeBytes, url]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [photo, file] }
        mimeType: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer }
        url: { type: string }
        thumbnailUrl: { type: string, nullable: true }

    Message:
      type: object
      required: [id, chatId, seq, senderId, sentAt, clientNonce]
      properties:
        id: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        seq:
          type: integer
          description: Per-chat monotonic sequence — ordering + read cursors
        senderId: { type: string, format: uuid }
        text: { type: string, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        replyToMessageId: { type: string, format: uuid, nullable: true }
        clientNonce:
          type: string
          description: Echoed for optimistic-UI dedup
        sentAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        pinned: { type: boolean }
