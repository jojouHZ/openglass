#
# OpenGlass test/beta server. Differences from the repo's dev compose, on
# purpose: NO database/cache/app port is published (only Caddy listens on the
# host), secrets come from .env (generated on the server by deploy.sh), and the
# Qdrant/embedder dev infrastructure is not part of the app and is left out.
#
# Lives at /opt/openglass/docker-compose.yml next to .env, Caddyfile,
# src/ (build context) and www/ (the built PWA).

name: openglass

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: openglass
      POSTGRES_USER: openglass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy.sh — it generates .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openglass -d openglass"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [internal]

  server:
    build: ./src
    environment:
      OPENGLASS_LISTEN: ":8081"
      OPENGLASS_PG_DSN: postgres://openglass:${POSTGRES_PASSWORD}@postgres:5432/openglass?sslmode=disable
      OPENGLASS_REDIS_ADDR: redis:6379
      OPENGLASS_UPLOADS_DIR: /data/uploads
      OPENGLASS_JWT_SECRET: ${OPENGLASS_JWT_SECRET:?run deploy.sh — it generates .env}
      # TEST MODE: the server has no email sender yet, so the login code is
      # written to the server log (`docker compose logs server`). Remove this
      # line once the SMTP sender exists.
      OPENGLASS_DEV_MODE: "1"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?run deploy.sh — it writes the domain into .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www/app:/srv/app:ro
      - ./www/dev:/srv/dev:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

networks:
  internal: {}

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
