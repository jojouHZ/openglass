services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: openglass-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API (for Go client)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
