services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: openglass-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API (for Go client)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: openglass-embedder
    ports:
      - "8080:80"
    volumes:
      - tei_models:/data
    command: --model-id BAAI/bge-large-en-v1.5 --port 80
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: openglass-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=openglass
      - POSTGRES_USER=openglass
      - POSTGRES_PASSWORD=openglass_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openglass"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build: .
    container_name: openglass-server
    ports:
      - "8081:8081"
    environment:
      - OPENGLASS_LISTEN=:8081
      - OPENGLASS_PG_DSN=postgres://openglass:openglass_dev@postgres:5432/openglass
      - OPENGLASS_REDIS_ADDR=redis:6379
      - OPENGLASS_DEV_MODE=1 # dev sender logs OTP codes; prod needs a real sender + JWT secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openglass-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  tei_models:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
